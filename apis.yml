aid: simudyne
name: Simudyne
description: >-
  Simudyne is a London-based enterprise simulation software company that builds
  AI-powered, agent-based (multi-agent) simulation technology for financial
  services and other industries. Its platform spans Simudyne Horizon (automated
  model discovery, calibration, and validation), Simudyne Pulse (multi-agent
  market simulation), and Simudyne Nexus (reasoning environments for training
  and optimization). Its developer-facing product, Pulse, is a synthetic market
  data platform exposing a REST API and a Python SDK that deliver tick-level
  L1/L2 synthetic order book data, order events, and trades at millisecond
  resolution for backtesting, algo development, market-impact studies, pre-trade
  TCA, and ML/reinforcement-learning training. Simudyne also maintains classic
  Java/Scala agent-based modeling SDK starter projects and runs on Google Cloud,
  AWS, Oracle, Red Hat, and NVIDIA infrastructure.
